      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: grava o chamado, devolve o protocolo e envia os dois e-mails
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  protocol:
                    type: string
                required:
                - id
                - protocol
        '422':
          description: categoria inválida
        '401':
          description: sem login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum:
                  - duvida
                  - problema
                  - financeiro
                  - privacidade
                subject:
                  type: string
                message:
                  type: string
              required:
              - category
              - subject
              - message
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:3000
  description: Desenvolvimento local
