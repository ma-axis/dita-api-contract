---
openapi: 3.0.1
info:
  title: Dita API
  version: v1
  description: Contrato gerado a partir de request specs reais (rswag) — nunca editar
    swagger/v1/swagger.yaml à mão, ele é sobrescrito por `bundle exec rspec` (ver
    spec/requests/).
paths:
  "/api/v1/auth/password":
    post:
      summary: esqueci minha senha
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: mesma mensagem genérica quando o e-mail existe de verdade
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                  required:
                  - email
              required:
              - user
    put:
      summary: redefine a senha com o token recebido por e-mail
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: troca a senha e já devolve um JWT novo (sign_in_after_reset_password)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum:
                        - owner
                        - staff
                      company_id:
                        type: integer
                      terms_outdated:
                        type: boolean
                    required:
                    - id
                    - name
                    - email
                    - role
                    - company_id
                    - terms_outdated
                required:
                - user
        '422':
          description: token inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    reset_password_token:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                  required:
                  - reset_password_token
                  - password
                  - password_confirmation
              required:
              - user
  "/api/v1/auth/sign_in":
    post:
      summary: login
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: devolve o JWT no header Authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
